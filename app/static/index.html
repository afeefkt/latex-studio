<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LaTeX Studio</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <!-- Top bar -->
  <header id="topbar">
    <button id="btn-toggle-sidebar" title="Toggle sidebar">☰</button>
    <span class="logo">LaTeX Studio</span>
    <span id="doc-label">No document</span>
    <div class="topbar-actions">
      <button id="btn-undo" title="Undo (Ctrl+Z)">↩</button>
      <button id="btn-redo" title="Redo (Ctrl+Shift+Z)">↪</button>
      <button id="btn-import" title="Import work history from text">📥 Import</button>
      <span id="status-badge" class="badge idle">Idle</span>
      <button id="btn-compile" title="Compile (Ctrl+Enter)">▶ Compile</button>
      <a id="btn-download" href="#" download class="btn-link" style="display:none">⬇ Download PDF</a>
    </div>
  </header>

  <!-- Main layout -->
  <div id="app-layout">
    <!-- Sidebar -->
    <aside id="sidebar">
      <div id="sidebar-header">
        <span>Documents</span>
        <button id="btn-new-doc" title="New document from template">+ New</button>
      </div>
      <nav id="doc-list">
        <div class="sidebar-empty">Loading…</div>
      </nav>
    </aside>

    <!-- Workspace -->
    <div id="workspace">
      <!-- Editor pane -->
      <div id="editor-pane">
        <!-- File tabs -->
        <div id="file-tabs"></div>
        <div id="editor-container"></div>
        <div id="error-panel">
          <div id="error-list"></div>
        </div>

        <!-- Horizontal drag handle (between error panel and chat) -->
        <div id="chat-resize-handle"></div>

        <!-- Chat panel -->
        <div id="chat-panel">
          <div id="chat-header">
            <span>Chat (LaTeX mode)</span>
            <select id="chat-provider">
              <option value="deepseek">DeepSeek</option>
              <option value="nvidia">NVIDIA</option>
              <option value="ollama">Ollama</option>
            </select>
            <select id="chat-model">
              <option value="">Auto</option>
            </select>
            <button id="btn-chat-clear" title="Clear chat">✕</button>
          </div>
          <div id="chat-messages">
            <div class="chat-empty">Ask the AI to edit your LaTeX code.<br><small>e.g. "make section headers blue", "increase font size to 12pt"</small></div>
          </div>
          <div id="chat-input-row">
            <textarea id="chat-input" placeholder="Ask about LaTeX formatting…" rows="1"></textarea>
            <button id="btn-chat-send">Send</button>
          </div>
        </div>
      </div>

      <!-- Resize handle -->
      <div id="drag-handle"></div>

      <!-- Preview pane -->
      <div id="preview-pane">
        <div id="pdf-toolbar">
          <button id="btn-prev" title="Previous page">‹</button>
          <span id="page-info">– / –</span>
          <button id="btn-next" title="Next page">›</button>
          <button id="btn-zoom-out" title="Zoom out">−</button>
          <span id="zoom-label">100%</span>
          <button id="btn-zoom-in" title="Zoom in">+</button>
          <button id="btn-fit" title="Fit width">⊡ Fit</button>
        </div>
        <div id="pdf-scroll-container">
          <canvas id="pdf-canvas"></canvas>
        </div>
        <div id="pdf-placeholder">
          <p>PDF preview will appear here after compile.</p>
          <p class="hint">Press <kbd>Ctrl+Enter</kbd> to compile.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Template picker modal -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <div id="modal-header">
        <span>New Document — Choose Template</span>
        <button id="modal-close">✕</button>
      </div>
      <div id="template-grid"></div>
      <div id="import-panel" class="hidden">
        <textarea id="import-textarea" placeholder="Paste your work history text here...&#10;&#10;Example:&#10;Embedded SW Development Engineer at KooSys GmbH, Regensburg (Sep 2024 - Present)&#10;- Developed MBD-based FOC algorithms...&#10;- Built 6-phase IPMSM Plant Model...&#10;Tools: MATLAB/Simulink, Embedded Coder, CANoe"></textarea>
      </div>
      <div id="modal-footer">
        <label for="new-doc-name">Document name:</label>
        <input id="new-doc-name" type="text" placeholder="e.g. airbus_cover_letter" />
        <button id="modal-create" disabled>Create</button>
        <button id="modal-import-btn" class="hidden">Import & Merge</button>
        <span id="modal-error" class="hidden"></span>
      </div>
    </div>
  </div>

  <!-- CodeMirror 6 (bundled ESM via jsDelivr) -->
  <script type="module" src="/static/app.js"></script>
</body>
</html>
